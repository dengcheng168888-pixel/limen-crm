services:
  crm:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - '127.0.0.1:8780:8780'
    volumes:
      - crm-data:/app/data
    healthcheck:
      test: ['CMD','python','-c','import urllib.request; urllib.request.urlopen("http://127.0.0.1:8780/health",timeout=3)']
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: ['no-new-privileges:true']
volumes:
  crm-data:
