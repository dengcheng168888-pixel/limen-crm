document.addEventListener('click',async e=>{let send=e.target.closest('[data-send]');if(send){e.stopPropagation();if(!confirm('确认审核发送真实业务事件？请确保平台映射、权限及用户数据授权均已验证。'))return;try{let r=await api('/api/events/'+encodeURIComponent(send.dataset.send)+'/send','POST');await load();render();notify(r.detail)}catch(err){notify(err.message)}return;}let el=e.target.closest('[data-page],[data-client],[data-action],[data-view]');if(!el){if(e.target.classList.contains('drawerback'))closeClient();return}if(el.dataset.page){page=el.dataset.page;closeClient();render();return}if(el.dataset.client){openClient(el.dataset.client);return}if(el.dataset.view!==undefined){let c=db.clients.find(c=>c.id===editing),a=c?.attachments[Number(el.dataset.view)];if(a){let dv=document.createElement('div');dv.className='overlay';let img=document.createElement('img');img.src=a.data;let b=document.createElement('button');b.className='btn secondary';b.textContent='关闭';b.onclick=()=>dv.remove();dv.append(img,b);dv.onclick=ev=>{if(ev.target===dv)dv.remove()};document.body.append(dv)}return}switch(el.dataset.action){case'logout':await api('/api/logout','POST');location.replace('/');break;case'refresh':try{await load();closeClient();render();notify('已同步最新数据')}catch(err){notify(err.message)}break;case'ai':try{let t=$('aiText').value;let r=await api('/api/ai/draft','POST',{text:t,mode:$('aiMode').value,language:$('aiLang').value});$('aiResult').value=r.text}catch(err){notify(err.message)}break;case'new':openClient(null);break;case'close':closeClient();break;case'lead':await generateEvent('有效线索');break;case'purchase':await generateEvent('成交');break;case'demo':await demo();break;case'export':backup();break;case'import':$('importFile').click();break;case'removeDemo':if(confirm('删除所有虚构示例和其模拟事件？真实资料不受影响。')&&await commit(n=>{n.clients=n.clients.filter(real);n.events=n.events.filter(e=>!e.demo)})){closeClient();render();notify('已删除示例数据')}break;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeClient();if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('client')){e.preventDefault();openClient(e.target.dataset.client)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;renderTable()}});document.addEventListener('change',async e=>{let k=e.target.id;if(k==='sourceFilter'){src=e.target.value;renderTable()}if(k==='stageFilter'){stage=e.target.value;renderTable()}if(k==='qualityFilter'){quality=e.target.value;renderTable()}if(k==='channelFilter'){channel=e.target.value;render()}if(k==='importFile'){let f=e.target.files[0];e.target.value='';if(!f)return;try{let d=JSON.parse(await f.text());if(!validDB(d))throw Error('文件格式无效');for(let c of d.clients)for(let a of c.attachments)if(!/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(a.data))throw Error('备份包含不支持的截图格式');if(confirm('导入会覆盖当前所有服务器客户及历史。确认已备份并继续？')&&await persist(d)){closeClient();render();notify('导入成功')}}catch(err){notify('导入失败：'+err.message)}}if(k==='attachment'){let id=editing,files=[...e.target.files];if(!id||id==='new'||!files.length)return;let items=[];try{for(let f of files){if(f.size>1048576||!['image/png','image/jpeg','image/webp'].includes(f.type))throw Error('请选择不超过 1 MB 的 PNG/JPEG/WebP 截图。');let data=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});items.push({name:f.name,data,time:stamp()})}if(await commit(n=>{let c=n.clients.find(x=>x.id===id);c.attachments.push(...items);record(c,'添加截图：'+items.map(a=>a.name).join('、'))})){render();openClient(id);notify('截图已保存')}}catch(err){notify(err.message||'截图保存失败')}}});document.addEventListener('submit',async e=>{if(e.target.id==='clientForm'){e.preventDefault();await saveForm(e.target)}if(e.target.id==='noteForm'){e.preventDefault();let id=editing,d=new FormData(e.target),s=String(d.get('note')||'').trim();if(!s)return;if(await commit(n=>{let c=n.clients.find(c=>c.id===id);if(d.has('contacted'))c.lastContact=stamp();record(c,'沟通记录：\n'+s)})){render();openClient(id);notify('沟通记录已保存')}}});load().then(render).catch(e=>{$("content").textContent="无法读取服务器："+e.message;});
</script></body></html>
